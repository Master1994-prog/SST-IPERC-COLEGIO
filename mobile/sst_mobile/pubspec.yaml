name: sst_mobile
description: "Aplicación móvil SST/IPERC"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.10.0
  connectivity_plus: ^7.2.0
  sqflite: ^2.4.3
  path: ^1.9.1
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^10.3.1
  provider: ^6.1.5+1
  internet_connection_checker_plus: ^3.1.1
  uuid: ^4.5.3
  intl: ^0.20.3
  json_annotation: ^4.12.0
  pdf: ^3.13.0
  printing: ^5.15.0
  excel_community: ^2.2.0
  path_provider: ^2.1.5
  share_plus: ^11.1.0
  image_picker: ^1.2.3

  # Hash/HMAC para la validación segura de contraseña offline.
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

flutter_native_splash:
  color: "#06358F"
  image: assets/icons/sst_edurisk_foreground_1024.png

  android: true
  ios: true

  android_12:
    color: "#06358F"
    image: assets/icons/sst_edurisk_foreground_1024.png

flutter_launcher_icons:
  android: true
  ios: true

  image_path: "assets/icons/sst_edurisk_icon_1024.png"

  adaptive_icon_background: "#06358F"
  adaptive_icon_foreground: "assets/icons/sst_edurisk_foreground_1024.png"

  min_sdk_android: 21

  remove_alpha_ios: true
